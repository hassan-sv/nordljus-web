<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordljus Sweden | Skandinavisk Belysning & Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070c18;
            --bg-card: rgba(18, 26, 47, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --aurora-cyan: #48e5c2;
            --aurora-blue: #33a8ff;
            --text-main: #f3f6fc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 500px;
            background: radial-gradient(circle, rgba(72, 229, 194, 0.15) 0%, rgba(51, 168, 255, 0.1) 40%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        header {
            padding: 32px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo span {
            background: linear-gradient(135deg, var(--aurora-cyan), var(--aurora-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: var(--text-sub);
            text-decoration: none;
            margin-left: 32px;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--aurora-cyan);
        }

        .hero {
            padding: 100px 0 80px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(72, 229, 194, 0.1);
            border: 1px solid rgba(72, 229, 194, 0.25);
            border-radius: 99px;
            color: var(--aurora-cyan);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .hero h2 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: 24px;
        }

        .hero p {
            color: var(--text-sub);
            font-size: 1.2rem;
            max-width: 620px;
            margin: 0 auto 40px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--aurora-cyan), var(--aurora-blue));
            color: var(--bg-deep);
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="#" class="logo">Nord<span>ljus</span></a>
            <nav>
                <a href="#produkter">Produkter</a>
                <a href="#om-oss">Om oss</a>
                <a href="#kontakt">Kontakt</a>
            </nav>
        </header>

        <section class="hero">
            <span class="badge">Ny kollektion 2026</span>
            <h2>Skandinavisk design möter nordiskt ljus</h2>
            <p>Tidlös estetik och hållbara material skapade för att lysa upp hemmets alla rum.</p>
            <a href="#produkter" class="btn">Utforska kollektionen</a>
        </section>
    </div>
</body>
</html>

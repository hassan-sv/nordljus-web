name: Deploy Static Website to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-nordljus-web-001'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5F36995DB566444781D615A5067E46AE }}
          package: .
